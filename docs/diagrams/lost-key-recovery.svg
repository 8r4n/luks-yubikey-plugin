<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="500px" preserveAspectRatio="none" style="width:553px;height:500px;background:#FFFFFF;" version="1.1" viewBox="0 0 553 500" width="553px" zoomAndPan="magnify"><title>Lost YubiKey Recovery Procedure</title><defs/><g><text fill="#000000" font-family="Verdana" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="418.6123" x="65.772" y="35.4209">Lost YubiKey Recovery Procedure</text><ellipse cx="114.4697" cy="61.6094" fill="#FFFFFF" rx="10" ry="10" style="stroke:#000000;stroke-width:1.0;"/><path d="M234.4229,88.4609 L234.4229,104.5938 L214.4229,108.5938 L234.4229,112.5938 L234.4229,128.7266 A0,0 0 0 0 234.4229,128.7266 L406.4526,128.7266 A0,0 0 0 0 406.4526,128.7266 L406.4526,98.4609 L396.4526,88.4609 L234.4229,88.4609 A0,0 0 0 0 234.4229,88.4609 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M396.4526,88.4609 L396.4526,98.4609 L406.4526,98.4609 L396.4526,88.4609 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="151.0298" x="240.4229" y="105.5278">Enter LUKS passphrase</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="98.1475" x="240.4229" y="120.6606">at boot prompt</text><rect fill="#FFFFFF" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1.0;" width="199.9063" x="14.5166" y="91.6094"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="179.9063" x="24.5166" y="112.748">Boot with passphrase fallback</text><path d="M220.7881,153.1445 L220.7881,161.7109 L200.7881,165.7109 L220.7881,169.7109 L220.7881,178.2773 A0,0 0 0 0 220.7881,178.2773 L531.2158,178.2773 A0,0 0 0 0 531.2158,178.2773 L531.2158,163.1445 L521.2158,153.1445 L220.7881,153.1445 A0,0 0 0 0 220.7881,153.1445 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M521.2158,153.1445 L521.2158,163.1445 L531.2158,163.1445 L521.2158,153.1445 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="289.4277" x="226.7881" y="170.2114">sudo cryptsetup luksDump /dev/nvme0n1p3</text><rect fill="#FFFFFF" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1.0;" width="172.6367" x="28.1514" y="148.7266"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="152.6367" x="38.1514" y="169.8652">Identify lost key's keyslot</text><path d="M242.9395,207.1133 L242.9395,215.6797 L222.9395,219.6797 L242.9395,223.6797 L242.9395,232.2461 A0,0 0 0 0 242.9395,232.2461 L546.1563,232.2461 A0,0 0 0 0 546.1563,232.2461 L546.1563,217.1133 L536.1563,207.1133 L242.9395,207.1133 A0,0 0 0 0 242.9395,207.1133 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M536.1563,207.1133 L536.1563,217.1133 L546.1563,217.1133 L536.1563,207.1133 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="282.2168" x="248.9395" y="224.1802">sudo ./unenroll.sh -s &lt;N&gt; /dev/nvme0n1p3</text><rect fill="#FFFFFF" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1.0;" width="216.9395" x="6" y="202.6953"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="196.9395" x="16" y="223.834">Remove lost key's FIDO2 keyslot</text><rect fill="#FFFFFF" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1.0;" width="214.8887" x="7.0254" y="256.6641"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="194.8887" x="17.0254" y="277.8027">Insert new replacement YubiKey</text><path d="M201.8711,315.0508 L201.8711,323.6172 L181.8711,327.6172 L201.8711,331.6172 L201.8711,340.1836 A0,0 0 0 0 201.8711,340.1836 L437.3711,340.1836 A0,0 0 0 0 437.3711,340.1836 L437.3711,325.0508 L427.3711,315.0508 L201.8711,315.0508 A0,0 0 0 0 201.8711,315.0508 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M427.3711,315.0508 L427.3711,325.0508 L437.3711,325.0508 L427.3711,315.0508 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="214.5" x="207.8711" y="332.1177">sudo ./enroll.sh /dev/nvme0n1p3</text><rect fill="#FFFFFF" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1.0;" width="134.8027" x="47.0684" y="310.6328"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="114.8027" x="57.0684" y="331.7715">Enroll new YubiKey</text><path d="M195.707,369.0195 L195.707,377.5859 L175.707,381.5859 L195.707,385.5859 L195.707,394.1523 A0,0 0 0 0 195.707,394.1523 L307.5039,394.1523 A0,0 0 0 0 307.5039,394.1523 L307.5039,379.0195 L297.5039,369.0195 L195.707,369.0195 A0,0 0 0 0 195.707,369.0195 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M297.5039,369.0195 L297.5039,379.0195 L307.5039,379.0195 L297.5039,369.0195 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="90.7969" x="201.707" y="386.0864">sudo dracut -f</text><rect fill="#FFFFFF" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1.0;" width="122.4746" x="53.2324" y="364.6016"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="102.4746" x="63.2324" y="385.7402">Rebuild initramfs</text><rect fill="#FFFFFF" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1.0;" width="198.752" x="15.0938" y="418.5703"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="178.752" x="25.0938" y="439.709">Test reboot with new YubiKey</text><ellipse cx="114.4697" cy="483.5391" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1.0;"/><ellipse cx="114.4697" cy="483.5391" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.0;" x1="114.4697" x2="114.4697" y1="71.6094" y2="91.6094"/><polygon fill="#000000" points="110.4697,81.6094,114.4697,91.6094,118.4697,81.6094,114.4697,85.6094" style="stroke:#000000;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.0;" x1="114.4697" x2="114.4697" y1="125.5781" y2="148.7266"/><polygon fill="#000000" points="110.4697,138.7266,114.4697,148.7266,118.4697,138.7266,114.4697,142.7266" style="stroke:#000000;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.0;" x1="114.4697" x2="114.4697" y1="182.6953" y2="202.6953"/><polygon fill="#000000" points="110.4697,192.6953,114.4697,202.6953,118.4697,192.6953,114.4697,196.6953" style="stroke:#000000;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.0;" x1="114.4697" x2="114.4697" y1="236.6641" y2="256.6641"/><polygon fill="#000000" points="110.4697,246.6641,114.4697,256.6641,118.4697,246.6641,114.4697,250.6641" style="stroke:#000000;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.0;" x1="114.4697" x2="114.4697" y1="290.6328" y2="310.6328"/><polygon fill="#000000" points="110.4697,300.6328,114.4697,310.6328,118.4697,300.6328,114.4697,304.6328" style="stroke:#000000;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.0;" x1="114.4697" x2="114.4697" y1="344.6016" y2="364.6016"/><polygon fill="#000000" points="110.4697,354.6016,114.4697,364.6016,118.4697,354.6016,114.4697,358.6016" style="stroke:#000000;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.0;" x1="114.4697" x2="114.4697" y1="398.5703" y2="418.5703"/><polygon fill="#000000" points="110.4697,408.5703,114.4697,418.5703,118.4697,408.5703,114.4697,412.5703" style="stroke:#000000;stroke-width:1.0;"/>