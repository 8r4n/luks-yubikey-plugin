<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="516px" preserveAspectRatio="none" style="width:654px;height:516px;background:#FFFFFF;" version="1.1" viewBox="0 0 654 516" width="654px" zoomAndPan="magnify"><title>Master Key Wrapping in LUKS2</title><defs/><g><text fill="#000000" font-family="Verdana" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="386.7617" x="129.1191" y="35.4209">Master Key Wrapping in LUKS2</text><!--cluster ks0--><g id="cluster_ks0"><rect fill="#90EE90" height="218" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="306" x="12" y="58.6094"/><text fill="#000000" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="174.542" x="77.729" y="73.6045">Keyslot 0: Passphrase</text></g><!--cluster ks1--><g id="cluster_ks1"><rect fill="#ADD8E6" height="218" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="306" x="342" y="58.6094"/><text fill="#000000" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="201.3047" x="394.3477" y="73.6045">Keyslot 1: FIDO2 YubiKey</text></g><!--entity dk0--><g id="elem_dk0"><rect fill="#FFFFFF" height="52.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="207.4756" x="61.5" y="93.6094"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="187.4756" x="71.5" y="116.6045">argon2id(passphrase, salt)</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="98.5674" x="71.5" y="132.9014">&#8594; derived key</text></g><!--entity ewk0--><g id="elem_ewk0"><rect fill="#FFFFFF" height="52.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="273.1689" x="28.5" y="207.6094"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="253.1689" x="38.5" y="230.6045">AES-wrap(derived_key, master_key)</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="170.5566" x="38.5" y="246.9014">&#8594; encrypted master key</text></g><!--entity dk1--><g id="elem_dk1"><rect fill="#FFFFFF" height="52.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="143.4775" x="423.5" y="93.6094"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="123.4775" x="433.5" y="116.6045">hmac-secret(salt)</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="98.5674" x="433.5" y="132.9014">&#8594; derived key</text></g><!--entity ewk1--><g id="elem_ewk1"><rect fill="#FFFFFF" height="52.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="273.1689" x="358.5" y="207.6094"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="253.1689" x="368.5" y="230.6045">AES-wrap(derived_key, master_key)</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="170.5566" x="368.5" y="246.9014">&#8594; encrypted master key</text></g><!--entity mk--><g id="elem_mk"><rect fill="#FFC0CB" height="52.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="139.7109" x="259" y="339.6094"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="78.3398" x="269" y="362.6045">Master Key</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="119.7109" x="269" y="378.9014">(512-bit random)</text></g><g id="elem_GMN14"><path d="M188.5,453.6094 L188.5,509.0078 A0,0 0 0 0 188.5,509.0078 L469.4937,509.0078 A0,0 0 0 0 469.4937,509.0078 L469.4937,463.6094 L459.4937,453.6094 L333,453.6094 L329,392.7494 L325,453.6094 L188.5,453.6094 A0,0 0 0 0 188.5,453.6094 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M459.4937,453.6094 L459.4937,463.6094 L469.4937,463.609