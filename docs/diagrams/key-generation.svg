<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="678px" preserveAspectRatio="none" style="width:531px;height:678px;background:#FFFFFF;" version="1.1" viewBox="0 0 531 678" width="531px" zoomAndPan="magnify"><title>FIDO2 Key Generation (makeCredential)</title><defs/><g><text fill="#000000" font-family="Verdana" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="498.9854" x="15" y="35.4209">FIDO2 Key Generation (makeCredential)</text><line style="stroke:#000000;stroke-width:1.0;" x1="57.2646" x2="57.2646" y1="99.2031" y2="626.5234"/><line style="stroke:#000000;stroke-width:1.0;" x1="287.6821" x2="287.6821" y1="99.2031" y2="626.5234"/><rect fill="#FFFFFF" height="30.2969" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="45.876" x="35.2646" y="67.9063"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="31.876" x="42.2646" y="87.9014">Host</text><rect fill="#FFFFFF" height="30.2969" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="45.876" x="35.2646" y="625.5234"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="31.876" x="42.2646" y="645.5186">Host</text><rect fill="#FFFFFF" height="46.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="124.8516" x="225.6821" y="51.6094"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="56.2803" x="259.9678" y="71.6045">YubiKey</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="110.8516" x="232.6821" y="87.9014">Secure Element</text><rect fill="#FFFFFF" height="46.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="124.8516" x="225.6821" y="625.5234"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="56.2803" x="259.9678" y="645.5186">YubiKey</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="110.8516" x="232.6821" y="661.8154">Secure Element</text><polygon fill="#000000" points="276.1079,186.8672,286.1079,190.8672,276.1079,194.8672,280.1079,190.8672" style="stroke:#000000;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.0;" x1="58.2026" x2="282.1079" y1="190.8672" y2="190.8672"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="108.4243" x="65.2026" y="125.27">makeCredential(</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="197.6406" x="73.4673" y="140.4028">rpId="io.systemd.cryptsetup",</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="152.9849" x="73.4673" y="155.5356">userId=&lt;device-uuid&gt;,</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="118.6377" x="73.4673" y="170.6685">hmac-secret=true</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="5.0718" x="65.2026" y="185.8013">)</text><line style="stroke:#000000;stroke-width:1.0;" x1="288.1079" x2="330.1079" y1="250.2656" y2="250.2656"/><line style="stroke:#000000;stroke-width:1.0;" x1="330.1079" x2="330.1079" y1="250.2656" y2="263.2656"/><line style="stroke:#000000;stroke-width:1.0;" x1="289.1079" x2="330.1079" y1="263.2656" y2="263.2656"/><polygon fill="#000000" points="299.1079,259.2656,289.1079,263.2656,299.1079,267.2656,295.1079,263.2656" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="158.8501" x="295.1079" y="214.9341">Generate P-256 key pair</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="188.2017" x="303.3726" y="230.0669">private_key = random scalar</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="192.9053" x="303.3726" y="245.1997">public_key = private_key &#215; G</text><line style="stroke:#000000;stroke-width:1.0;" x1="288.1079" x2="330.1079" y1="322.6641" y2="322.6641"/><line style="stroke:#000000;stroke-width:1.0;" x1="330.1079" x2="330.1079" y1="322.6641" y2="335.6641"/><line style="stroke:#000000;stroke-width:1.0;" x1="289.1079" x2="330.1079" y1="335.6641" y2="335.6641"/><polygon fill="#000000" points="299.1079,331.6641,289.1079,335.6641,299.1079,339.6641,295.1079,335.6641" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="131.2441" x="295.1079" y="287.3325">Create credential_id</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="199.3481" x="303.3726" y="302.4653">(encrypted private_key handle</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="112.7153" x="303.3726" y="317.5981">or slot reference)</text><line style="stroke:#000000;stroke-width:1.0;" x1="288.1079" x2="330.1079" y1="379.9297" y2="379.9297"/><line style="stroke:#000000;stroke-width:1.0;" x1="330.1079" x2="330.1079" y1="379.9297" y2="392.9297"/><line style="stroke:#000000;stroke-width:1.0;" x1="289.1079" x2="330.1079" y1="392.9297" y2="392.9297"/><polygon fill="#000000" points="299.1079,388.9297,289.1079,392.9297,299.1079,396.9297,295.1079,392.9297" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="129.4795" x="295.1079" y="359.731">Enable hmac-secret</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="115.1274" x="303.3726" y="374.8638">for this credential</text><polygon fill="#000000" points="69.2026,478.5938,59.2026,482.5938,69.2026,486.5938,65.2026,482.5938" style="stroke:#000000;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="63.2026" x2="287.1079" y1="482.5938" y2="482.5938"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="8.271" x="75.2026" y="416.9966">{</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="87.7627" x="83.4673" y="432.1294">credential_id,</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="72.9663" x="83.4673" y="447.2622">public_key,</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="138.9185" x="83.4673" y="462.395">attestation_signature</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="8.271" x="75.2026" y="477.5278">}</text><path d="M188.2646,495.5938 L188.2646,610.5938 L386.2646,610.5938 L386.2646,505.5938 L376.2646,495.5938 L188.2646,495.5938 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M376.2646,495.5938 L376.2646,505.5938 L386.2646,505.5938 L376.2646,495.5938 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="167.2861" x="194.2646" y="512.6606">Private key NEVER leaves</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="130.8379" x="194.2646" y="527.7935">the secure element.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="194.2646" y="542.9263">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="155.3208" x="194.2646" y="558.0591">credential_id is opaque:</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="177.2202" x="194.2646" y="573.1919">either an encrypted handle</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="149.6777" x="194.2646" y="588.3247">(non-resident) or a slot</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="107.5166" x="194.2646" y="603.4575">index (resident).</text><!--SRC=[NL9TRzD047o_Nx645qUgyr097YBIbvAM2Waga92G8aMRksszYhrdxYCYGlmEVX1_Z3sx51i_dJqpDpixVf4QwWZw5bbCFBBq6B230zhZO_1PtBLlVO2NDyDZJEBK4jpSlVru2U_f3BSa532n5wWwFD9r84UI6DkbCNfNOiizIeB5En_J0Z12euSvz3KVM2_RoMUoEH1iMvr9HdOaOue2wYizmnhcBjLE049_vpOBzgjuZeawjxBXtAT8AVUBYqB8aO9ItZWwiQKwPtPN0z1qQEj8Db3Qf91f9pgsslmrUuf7S5zVldeDHqtS8uSYxGEV5DcNRni8ACvt42ssECBvqB9zGgVStx_WTcgXMOg1VOwqPrSkg4Y66EHcyaQDMYe4hIMsFa6W1mfAfkNqsgtWGPkQ12oQ1nMbXkF4Riohic7BQ_XHUBDfBkPvXbTCYM8QYjz7VXHCMjnEVXeZNjFu4uLI7S3zEFkmkW_RBzjFq1AUA2galvvoXiPfR7nbp7_UeBFw7hzbMYj4h9e0AF1lEUD25Ap4InqeSb4lotfmM912B8w-G_KChWo9WpBf7m00]--></g></svg>