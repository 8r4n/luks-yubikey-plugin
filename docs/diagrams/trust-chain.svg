<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1146px" preserveAspectRatio="none" style="width:485px;height:1146px;background:#FFFFFF;" version="1.1" viewBox="0 0 485 1146" width="485px" zoomAndPan="magnify"><title>Trust Chain &#8212; FIDO2 YubiKey LUKS2</title><defs/><g><text fill="#000000" font-family="Verdana" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="452.042" x="15" y="35.4209">Trust Chain &#8212; FIDO2 YubiKey LUKS2</text><!--cluster Root of Trust--><g id="cluster_Root of Trust"><rect fill="#FFFFFF" height="122" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="431" x="46.521" y="226.6094"/><text fill="#000000" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="103.6123" x="210.2148" y="241.6045">Root of Trust</text></g><!--cluster Derived Trust--><g id="cluster_Derived Trust"><rect fill="#FFFFFF" height="624" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="217" x="72.521" y="397.6094"/><text fill="#000000" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="107.7822" x="127.1299" y="412.6045">Derived Trust</text></g><!--cluster User Trust--><g id="cluster_User Trust"><rect fill="#FFFFFF" height="104" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="361" x="19.521" y="58.6094"/><text fill="#000000" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="82.4209" x="158.8105" y="73.6045">User Trust</text></g><!--entity se--><g id="elem_se"><rect fill="#90EE90" height="52.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="191.582" x="62.521" y="270.6094"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="171.582" x="72.521" y="293.6045">YubiKey Secure Element</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="124.6328" x="72.521" y="309.9014">(SLE78 / Infineon)</text></g><g id="elem_GMN4"><path d="M289.521,261.6094 L289.521,293.1094 L254.731,297.1094 L289.521,301.1094 L289.521,332.1406 A0,0 0 0 0 289.521,332.1406 L461.4746,332.1406 A0,0 0 0 0 461.4746,332.1406 L461.4746,271.6094 L451.4746,261.6094 L289.521,261.6094 A0,0 0 0 0 289.521,261.6094 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M451.4746,261.6094 L451.4746,271.6094 L461.4746,271.6094 L451.4746,261.6094 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="149.2397" x="295.521" y="278.6763">Hardware root of trust.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="150.9536" x="295.521" y="293.8091">Private keys generated</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="107.853" x="295.521" y="308.9419">and stored here.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="115.8892" x="295.521" y="324.0747">Tamper-resistant.</text></g><!--entity cred--><g id="elem_cred"><rect fill="#FFFFFF" height="52.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="139.7041" x="88.521" y="432.6094"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="119.7041" x="98.521" y="455.6045">FIDO2 Credential</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="112.1572" x="98.521" y="471.9014">(P-256 key pair)</text></g><!--entity hmac--><g id="elem_hmac"><rect fill="#FFFFFF" height="52.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="171.9014" x="88.521" y="562.6094"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="140.3828" x="98.521" y="585.6045">hmac-secret Output</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="151.9014" x="98.521" y="601.9014">(32-byte derived key)</text></g><!--entity ks--><g id="elem_ks"><rect fill="#FFFFFF" height="52.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="175.2578" x="89.021" y="692.6094"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="100.7891" x="99.021" y="715.6045">LUKS2 Keyslot</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="155.2578" x="99.021" y="731.9014">(wrapped master key)</text></g><!--entity mk--><g id="elem_mk"><rect fill="#FFFFFF" height="52.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="162.167" x="88.521" y="822.6094"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="78.3398" x="98.521" y="845.6045">Master Key</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="142.167" x="98.521" y="861.9014">(volume encryption)</text></g><!--entity data--><g id="elem_data"><rect fill="#FFFFFF" height="52.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="129.2109" x="89.021" y="952.6094"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="109.2109" x="99.021" y="975.6045">Encrypted Data</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="102.0879" x="99.021" y="991.9014">(AES-256-XTS)</text></g><!--entity pin--><g id="elem_pin"><rect fill="#FFFFFF" height="52.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="152.2754" x="35.521" y="93.6094"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="70.3828" x="45.521" y="116.6045">FIDO2 PIN</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="132.2754" x="45.521" y="132.9014">(knowledge factor)</text></g><!--entity touch--><g id="elem_touch"><rect fill="#FFFFFF" height="52.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="140.7363" x="223.021" y="93.6094"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="103.9609" x="233.021" y="116.6045">Physical Touch</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="120.7363" x="233.021" y="132.9014">(presence factor)</text></g><g id="elem_GMN23"><path d="M47.521,1068.6094 L47.521,1139.1406 A0,0 0 0 0 47.521,1139.1406 L259.6807,1139.1406 A0,0 0 0 0 259.6807,1139.1406 L259.6807,1078.6094 L249.6807,1068.6094 L157.521,1068.6094 L153.521,1005.8894 L149.521,1068.6094 L47.521,1068.6094 A0,0 0 0 0 47.521,1068.6094 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M249.6807,1068.6094 L249.6807,1078.6094 L259.6807,1078.6094 L249.6807,1068.6094 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="157.3457" x="53.521" y="1085.6763">Breaking the trust chain</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="191.1597" x="53.521" y="1100.8091">requires compromising BOTH</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="176.3633" x="53.521" y="1115.9419">the YubiKey hardware AND</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="168.4287" x="53.521" y="1131.0747">the user's PIN knowledge.</text></g><!--link se to cred--><g id="link_se_cred"><path d="M158.521,323.8194 C158.521,353.6694 158.521,396.6394 158.521,426.4694 " fill="none" id="se-to-cred" style="stroke:#000000;stroke-width:1.0;"/><polygon fill="#000000" points="158.521,432.4694,162.521,423.4694,158.521,427.4694,154.521,423.4694,158.521,432.4694" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="124.0078" x="159.521" y="377.6763">generates &amp; stores</text></g><!--link pin to se--><g id="link_pin_se"><path d="M111.111,146.9794 C111.411,165.0794 113.001,189.6594 118.521,210.6094 C124.081,231.6894 131.8202,248.6545 140.7002,265.1745 " fill="none" id="pin-to-se" style="stroke:#000000;stroke-width:1.0;"/><polygon fill="#000000" points="143.541,270.4594,142.8031,260.6382,141.1737,266.0553,135.7566,264.4259,143.541,270.4594" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="84.0239" x="140.9824" y="191.6763">gates access</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="126.9468" x="119.521" y="206.8091">(verified on-device)</text></g><!--link touch to se--><g id="link_touch_se"><path d="M284.171,146.8194 C276.681,165.5194 265.041,190.8994 250.521,210.6094 C233.841,233.2594 215.2205,250.9485 196.2705,266.7385 " fill="none" id="touch-to-se" style="stroke:#000000;stroke-width:1.0;"/><polygon fill="#000000" points="191.661,270.5794,201.1359,267.8911,195.5023,267.3787,196.0147,261.7451,191.661,270.5794" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="109.4082" x="276.7415" y="191.6763">gates operations</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="123.8491" x="269.521" y="206.8091">(capacitive sensor)</text></g><!--link cred to hmac--><g id="link_cred_hmac"><path d="M161.721,485.7094 C164.511,508.0294 167.7965,534.2957 170.5865,556.6057 " fill="none" id="cred-to-hmac" style="stroke:#000000;stroke-width:1.0;"/><polygon fill="#000000" points="171.331,562.5594,174.1833,553.1326,170.7105,557.598,166.2451,554.1253,171.331,562.5594" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="148.8018" x="167.521" y="528.6763">hmac-secret extension</text></g><!--link hmac to ks--><g id="link_hmac_ks"><path d="M174.921,615.7094 C175.271,638.0294 175.6769,664.2501 176.0269,686.5601 " fill="none" id="hmac-to-ks" style="stroke:#000000;stroke-width:1.0;"/><polygon fill="#000000" points="176.121,692.5594,179.9793,683.4977,176.0426,687.56,171.9803,683.6232,176.121,692.5594" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="100.2803" x="176.521" y="658.6763">unlocks keyslot</text></g><!--link ks to mk--><g id="link_ks_mk"><path d="M175.121,745.7094 C173.901,768.0294 172.4686,794.2583 171.2486,816.5683 " fill="none" id="ks-to-mk" style="stroke:#000000;stroke-width:1.0;"/><polygon fill="#000000" points="170.921,822.5594,175.4065,813.7912,171.194,817.5668,167.4184,813.3544,170.921,822.5594" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="133.8848" x="173.521" y="788.6763">decrypts master key</text></g><!--link mk to data--><g id="link_mk_data"><path d="M166.321,875.7094 C163.531,898.0294 160.2455,924.2957 157.4555,946.6057 " fill="none" id="mk-to-data" style="stroke:#000000;stroke-width:1.0;"/><polygon fill="#000000" points="156.711,952.5594,161.7969,944.1253,157.3314,947.598,153.8587,943.1326,156.711,952.5594" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="147.7798" x="162.521" y="918.6763">encrypts/decrypts disk</text></g><!--SRC=[VLJTRjCm6BttKtni4h2BR58HF-82QLixDcri5UqaaBXndQ-DbSGsjhDH8IGUWYVaIJXsqj5LWbmbEUTyVyUVdyIAMoRNI6r4gBLnqikM5bBLAsyxKvxQndhQFykF4577Xcdkkn3fj8A8Vl_yHMSNuviHVUuM-fBNT7LxEHi9uLb5QLQWxtsqDf9Tzhez-Yu8pnQ-KSvOTPvfqg0c4x-OvxEhoUitT4GNPgaDMtEmHp9GODg_qgigllVC9WSpDZBvz2_b2Pn_4frBNzvBXFH31J5LS3YWKw_l97GrhmEjsB37Lpc0qfGKelLSKiMUDvgvR1t